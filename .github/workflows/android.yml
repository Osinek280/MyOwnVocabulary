name: Android CIon:  push:    branches: [ "main" ]  pull_request:    branches: [ "main" ]jobs:  build:    runs-on: ubuntu-latest    steps:      - name: Checkout        uses: actions/checkout@v4      - name: Set up JDK        uses: actions/setup-java@v4        with:          distribution: temurin          java-version: '17'      - name: Setup Gradle        uses: gradle/actions/setup-gradle@v4      - name: Check formatting        run: ./gradlew spotlessCheck      - name: Decode keystore        run: |          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"      - name: Build release APK        env:          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}        run: ./gradlew assembleRelease      - name: Upload APK        uses: actions/upload-artifact@v4        with:          name: app-release          path: app/build/outputs/apk/release/app-release.apk